# MediSuivi P5.0: disposable remote sandbox; NEVER real patient information.
# Connect a NEW empty Neon PostgreSQL database in APP_DATABASE_URL.
services:
  - type: web
    name: medisuivi-api-staging
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    branch: feat/medisuivi-p50-remote-web-android-sandbox
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header --workers 1
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: sandbox
      - key: APP_PUBLIC_WEB_ORIGIN
        value: https://medisuivi-web-staging.onrender.com
      - key: APP_SANDBOX_WRITES_ENABLED
        value: "true"
      - key: APP_SANDBOX_REGISTRATION_ENABLED
        value: "true"
      - key: APP_SANDBOX_INVITE_CODE
        sync: false
      - key: APP_ALLOW_DEVELOPMENT_REGISTRATION
        value: "false"
      - key: APP_ENABLE_EMAIL_AUTH
        value: "false"
      - key: APP_DATABASE_URL
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true

  - type: web
    name: medisuivi-web-staging
    runtime: static
    branch: feat/medisuivi-p50-remote-web-android-sandbox
    autoDeployTrigger: off
    buildCommand: bash scripts/build_render_web.sh
    staticPublishPath: build/web
    envVars:
      - key: MEDISUIVI_API_BASE_URL
        value: https://medisuivi-api-staging.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /index.html
        name: Cache-Control
        value: no-store
