name: medisuivi
description: Application personnelle de suivi clinique. Prototype sans données réelles.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  image_picker: ^1.2.4
  google_fonts: ^6.2.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  crypto: ^3.0.5
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.35.0
  path: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/images/home_hero_hd.webp

# Build hooks for SQLite3MultipleCiphers (encryption support)
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc