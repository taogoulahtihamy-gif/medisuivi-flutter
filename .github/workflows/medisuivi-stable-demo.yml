name: MediSuivi signed demo APK

# GitHub requires workflow_dispatch definitions on the default branch.
# For this project, the trusted integration branch triggers this automatically.
# Never provide signing material to pull_request jobs.
on:
  push:
    branches:
      - feat/medisuivi-premium-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-release:
    if: github.ref == 'refs/heads/feat/medisuivi-premium-redesign'
    name: Build and verify stable certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prepare privately stored signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDISUIVI_DEMO_KEYSTORE_BASE64 }}
          MEDISUIVI_SIGNING_STORE_PASSWORD: ${{ secrets.MEDISUIVI_DEMO_STORE_PASSWORD }}
          MEDISUIVI_SIGNING_KEY_ALIAS: ${{ secrets.MEDISUIVI_DEMO_KEY_ALIAS }}
          MEDISUIVI_SIGNING_KEY_PASSWORD: ${{ secrets.MEDISUIVI_DEMO_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.MEDISUIVI_DEMO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for item in KEYSTORE_BASE64 MEDISUIVI_SIGNING_STORE_PASSWORD MEDISUIVI_SIGNING_KEY_ALIAS MEDISUIVI_SIGNING_KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!item}" ]]; then
              echo "::error::Missing GitHub signing secret or repository variable: $item"
              exit 1
            fi
          done

          if ! [[ "$EXPECTED_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::MEDISUIVI_DEMO_CERT_SHA256 must have exactly 64 hex digits (no colons)."
            exit 1
          fi

          umask 077
          SIGNING_FILE="$RUNNER_TEMP/medisuivi-stable-demo.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
          test -s "$SIGNING_FILE"
          keytool -list -keystore "$SIGNING_FILE" \
            -storepass "$MEDISUIVI_SIGNING_STORE_PASSWORD" \
            -alias "$MEDISUIVI_SIGNING_KEY_ALIAS" >/dev/null
          echo "MEDISUIVI_SIGNING_STORE_FILE=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "Signing material verified; private key and passwords are not printed."

      - name: Build signed release APK
        shell: bash
        env:
          MEDISUIVI_SIGNING_STORE_PASSWORD: ${{ secrets.MEDISUIVI_DEMO_STORE_PASSWORD }}
          MEDISUIVI_SIGNING_KEY_ALIAS: ${{ secrets.MEDISUIVI_DEMO_KEY_ALIAS }}
          MEDISUIVI_SIGNING_KEY_PASSWORD: ${{ secrets.MEDISUIVI_DEMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --no-pub --build-number="$BUILD_NUMBER"
          echo "Build number: $BUILD_NUMBER"

      - name: Verify signed APK, certificate, package and architectures
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.MEDISUIVI_DEMO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p test-output
          unzip -tq "$APK" > test-output/zip-integrity.txt
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$TOOLS"

          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > test-output/signature.txt
          "$TOOLS/aapt" dump badging "$APK" > test-output/apk-badging.txt
          "$TOOLS/zipalign" -c -v 4 "$APK" > test-output/zipalignment.txt

          grep -q "package: name='com.example.medisuivi'" test-output/apk-badging.txt
          unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' > test-output/native-libraries.txt
          grep -q '^lib/arm64-v8a/libflutter\.so$' test-output/native-libraries.txt
          grep -q '^lib/x86_64/libflutter\.so$' test-output/native-libraries.txt

          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' test-output/signature.txt | head -n 1)"
          if ! [[ "$ACTUAL" =~ ^[[:xdigit:]]{64}$ ]] || [[ "${ACTUAL,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "::error::APK signing certificate does not match the pinned fingerprint."
            exit 1
          fi

          sha256sum "$APK" > test-output/apk-sha256.txt
          printf 'commit=%s\nrun_number=%s\ncertificate_sha256=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$ACTUAL" > test-output/build-info.txt
          echo "Stable signing certificate and APK inspection: SUCCESS"

      - name: Upload APK for isolated emulator verification
        uses: actions/upload-artifact@v4
        with:
          name: medisuivi-signed-apk-for-emulator
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload non-sensitive signing verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medisuivi-stable-signature-report
          path: test-output/
          retention-days: 7
          if-no-files-found: warn

      - name: Delete private signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/medisuivi-stable-demo.p12"

  verify-on-android-10:
    name: Verify signed release on Android 10
    needs: build-signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v4

      - uses: actions/download-artifact@v4
        with:
          name: medisuivi-signed-apk-for-emulator
          path: apk/

      - name: Allow emulator KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi

      - name: Authenticate and initialize encrypted clinical storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          script: MEDISUIVI_APK_PATH=apk/app-release.apk bash .github/scripts/android-emulator-smoke.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medisuivi-stable-release-api29-diagnostics
          path: test-output/
          retention-days: 7
          if-no-files-found: warn

  distribute:
    name: Publish device-test APK
    needs: verify-on-android-10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medisuivi-signed-apk-for-emulator
          path: deliverable/

      - name: Confirm APK for device testing
        shell: bash
        run: test -s deliverable/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediSuivi-V1-Android-Stable-Demo
          path: deliverable/app-release.apk
          retention-days: 14
          if-no-files-found: error
