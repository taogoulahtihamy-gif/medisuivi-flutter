name: MediSuivi backend P1 tests

on:
  push:
    branches:
      - feat/medisuivi-p1-sn-auth-foundation
      - feat/medisuivi-p2-clinical-isolation
      - feat/medisuivi-p3-dev-auth-ui
      - feat/medisuivi-p32-profile-avatar
      - feat/medisuivi-p33-connected-clinical
      - feat/medisuivi-p34-auth-design
      - feat/medisuivi-p35-session-rotation
      - feat/medisuivi-p36-login-throttling
      - feat/medisuivi-p41-email-verification-reset
      - feat/medisuivi-p43-clinical-api-workflow
      - feat/medisuivi-p32-profile-avatar
    paths:
      - "backend/**"
      - ".github/workflows/medisuivi_backend_ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/medisuivi_backend_ci.yml"

permissions:
  contents: read

jobs:
  api-security:
    name: API auth and account-isolation checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test fail-closed config and two-account isolation
        run: python -m pytest tests/test_auth_isolation.py tests/test_clinical_isolation.py tests/test_private_profile.py tests/test_sessions_rotation.py tests/test_login_throttling.py tests/test_password_change.py tests/test_email_challenges.py -q
      - name: Python compile check
        run: python -m compileall -q app scripts
  postgres-isolation:
    name: PostgreSQL migration and A/B isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medisuivi_ci
          POSTGRES_USER: medisuivi_ci
          POSTGRES_PASSWORD: synthetic-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medisuivi_ci -d medisuivi_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_DATABASE_URL: postgresql+psycopg://medisuivi_ci:synthetic-only-ci-password@127.0.0.1:5432/medisuivi_ci
      APP_JWT_SECRET: CI-ONLY-synthetic-JWT-not-for-any-real-environment-123456789
      APP_ALLOW_DEVELOPMENT_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Upgrade empty PostgreSQL schema with Alembic
        run: python -m alembic upgrade head
      - name: Check migration and prevent cross-account clinical operations
        run: python -m pytest tests/test_postgres_isolation.py tests/test_postgres_clinical_roundtrip.py -q
