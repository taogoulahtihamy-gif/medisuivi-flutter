name: Bundle offline DM Sans font

on:
  push:
    branches:
      - feat/medisuivi-sprint5n-layout-typography

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch licensed font binaries
        run: python tools/bundle_dm_sans_font.py
      - name: Package licensed font for offline installation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/
          if git diff --cached --quiet; then
            echo "No font assets changed"
          else
            git commit -m "assets: bundle DM Sans font and its OFL license"
            git push origin HEAD:feat/medisuivi-sprint5n-layout-typography
          fi
