name: MediSuivi P4.6 Android connected debug

on:
  push:
    branches:
      - feat/medisuivi-p46-android-device-staging
    paths:
      - "android/**"
      - "lib/**"
      - "test/p42_*"
      - "test/p45_clinical_session_race_test.dart"
      - "test/p46_connected_auth_gate_test.dart"
      - "test/p46_android_api_transport_test.dart"
      - "scripts/check_android_p46_security.py"
      - ".github/workflows/medisuivi_p46_android_ci.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
  pull_request:
    paths:
      - "android/**"
      - "lib/**"
      - "test/p42_*"
      - "test/p45_clinical_session_race_test.dart"
      - "test/p46_connected_auth_gate_test.dart"
      - "test/p46_android_api_transport_test.dart"
      - "scripts/check_android_p46_security.py"
      - ".github/workflows/medisuivi_p46_android_ci.yml"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  contents: read

jobs:
  android-debug-connected:
    name: Verify Android network rules and build USB device APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Check Android security manifests
        run: python3 scripts/check_android_p46_security.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Check login restore and stale clinical replies
        run: flutter test test/p42_secure_session_resume_test.dart test/p42_session_gate_test.dart test/p45_clinical_session_race_test.dart test/p46_connected_auth_gate_test.dart test/p46_android_api_transport_test.dart
      - name: Build USB loopback-connected debug APK
        run: flutter build apk --debug --no-pub --dart-define=MEDISUIVI_DEV_API_BASE_URL=http://127.0.0.1:8027
      - name: Verify APK and INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$build_tools"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          echo "Debug USB APK verified (synthetic data only)."
      - name: Upload device-testing debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medisuivi-p46-usb-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          if-no-files-found: error
