name: Flutter quality checks
on:
  push:
    branches: [main, develop, 'feat/medisuivi-premium-redesign']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android,web --project-name medisuivi .
      - name: Get dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Production Web build
        run: flutter build web --release
