name: Build MediSuivi home hero HD

on:
  push:
    branches:
      - fix/medisuivi-home-photo-hd

permissions:
  contents: write

jobs:
  upscale:
    if: ${{ github.event.head_commit.message != 'assets: generate upgraded offline home photo' }}
    name: Generate bundled image from original
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up 4x photo upscaler
        run: |
          python -m pip install --disable-pip-version-check "numpy<2" "opencv-contrib-python-headless==4.10.0.84"
      - name: Enhance embedded original, without changing its subject
        run: python tools/upgrade_home_hero.py
      - name: Push optimized offline asset back to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/home_hero_hd.webp
          if git diff --cached --quiet; then
            echo "No image change."
          else
            git commit -m "assets: generate upgraded offline home photo"
            git push origin HEAD:fix/medisuivi-home-photo-hd
          fi
