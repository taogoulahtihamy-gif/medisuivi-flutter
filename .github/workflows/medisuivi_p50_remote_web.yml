name: MediSuivi P5.0 public HTTPS Web build

on:
  push:
    branches:
      - feat/medisuivi-p50-remote-web-android-sandbox
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "scripts/build_render_web.sh"
      - "scripts/check_remote_api_url.py"
      - ".github/workflows/medisuivi_p50_remote_web.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
  pull_request:
    paths:
      - "lib/**"
      - "web/**"
      - "scripts/build_render_web.sh"
      - "scripts/check_remote_api_url.py"
      - ".github/workflows/medisuivi_p50_remote_web.yml"

permissions:
  contents: read

jobs:
  web-build:
    name: Compile original Flutter UI for public Render HTTPS API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEDISUIVI_API_BASE_URL: https://medisuivi-api-staging.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Test private invitation on public Web build
        run: flutter test test/p50_remote_signup_test.dart --dart-define=MEDISUIVI_REMOTE_SANDBOX=true
      - name: Build exact public web bundle used by Render
        run: bash scripts/build_render_web.sh
      - name: Check bundle and reject development HTTP endpoints
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          if grep -R --include='*.js' -F \
            'http://127.0.0.1:8027' build/web; then
            echo 'Local API address leaked into remote Web bundle'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: medisuivi-p50-render-web-preview
          path: build/web/
          retention-days: 3
          if-no-files-found: error
