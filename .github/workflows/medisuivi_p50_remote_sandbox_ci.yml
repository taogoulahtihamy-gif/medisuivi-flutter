name: MediSuivi P5.0 remote sandbox gates

on:
  push:
    branches:
      - feat/medisuivi-p50-remote-web-android-sandbox
    paths:
      - "render.yaml"
      - "backend/**"
      - "scripts/build_render_web.sh"
      - "scripts/check_remote_api_url.py"
      - ".github/workflows/medisuivi_p50_remote_sandbox_ci.yml"
  pull_request:
    paths:
      - "render.yaml"
      - "backend/**"
      - "scripts/build_render_web.sh"
      - "scripts/check_remote_api_url.py"
      - ".github/workflows/medisuivi_p50_remote_sandbox_ci.yml"

permissions:
  contents: read

jobs:
  sandbox:
    name: HTTPS origin, invite, demo CRUD and isolated PG17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medisuivi_ci
          POSTGRES_USER: medisuivi_ci
          POSTGRES_PASSWORD: synthetic-ci-only-not-on-render
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medisuivi_ci -d medisuivi_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: sandbox
      APP_DATABASE_URL: postgresql+psycopg://medisuivi_ci:synthetic-ci-only-not-on-render@127.0.0.1:5432/medisuivi_ci
      APP_JWT_SECRET: p50-ci-only-unique-synthetic-jwt-not-for-any-real-deployment
      APP_PUBLIC_WEB_ORIGIN: https://medisuivi-web-staging.onrender.com
      APP_SANDBOX_INVITE_CODE: p50-ci-only-synthetic-invitation-not-on-render
      APP_SANDBOX_WRITES_ENABLED: "true"
      APP_SANDBOX_REGISTRATION_ENABLED: "true"
      APP_ENABLE_EMAIL_AUTH: "false"
      APP_ALLOW_DEVELOPMENT_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject HTTP/private API origin
        run: |
          python3 scripts/check_remote_api_url.py https://medisuivi-api-staging.onrender.com
          if python3 scripts/check_remote_api_url.py http://127.0.0.1:8027; then
            echo "ERROR: accepted HTTP loopback as remote API"; exit 1
          fi
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Migrate disposable PostgreSQL 17
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Test sandbox registrations, CORS, ownership and writes
        working-directory: backend
        run: python -m pytest tests/test_p50_remote_sandbox.py -q
