# OPTIONAL local mailbox for strictly fictitious development accounts.
# Run with: docker compose -f docker-compose.yml -f docker-compose.mailpit.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    environment:
      MP_MAX_MESSAGES: "100"
    networks: [default]
